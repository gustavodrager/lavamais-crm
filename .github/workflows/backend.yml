name: Backend

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "testes/backend/**"
      - "scripts/backend/**"
      - "Directory.*.props"
      - "global.json"
      - "LavaMais.Crm.slnx"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "testes/backend/**"
      - "scripts/backend/**"
      - "Directory.*.props"
      - "global.json"
      - "LavaMais.Crm.slnx"
      - ".github/workflows/backend.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restaurar dependencias
        run: dotnet restore LavaMais.Crm.slnx
      - name: Verificar formatacao
        run: dotnet format LavaMais.Crm.slnx --verify-no-changes --no-restore
      - name: Auditar dependencias vulneraveis
        run: dotnet list LavaMais.Crm.slnx package --vulnerable --include-transitive
      - name: Compilar
        run: dotnet build LavaMais.Crm.slnx --configuration Release --no-restore
      - name: Executar testes
        run: dotnet test LavaMais.Crm.slnx --configuration Release --no-build
